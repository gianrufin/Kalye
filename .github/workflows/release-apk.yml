name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v1.0.2 or "auto" to bump patch)'
        required: true
        default: 'auto'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "auto" ]; then
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v1.0.1"
            else
              CLEAN="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN%%-*}"
              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}
              NEXT_PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          else
            case "$RAW_TAG" in
              v*) TAG="$RAW_TAG" ;;
              *) TAG="v${RAW_TAG}" ;;
            esac
          fi

          VERSION_NAME="${TAG#v}"
          IFS='.' read -r V_MAJ V_MIN V_PAT <<< "${VERSION_NAME%%-*}"
          V_MAJ=${V_MAJ:-1}
          V_MIN=${V_MIN:-0}
          V_PAT=${V_PAT:-0}
          VERSION_CODE=$((V_MAJ * 10000 + V_MIN * 100 + V_PAT))

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$TAG versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > my-upload-key.jks
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > debug.keystore
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Google Services config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using repository app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
          else
            echo "::warning::app/google-services.json not found. APK will compile, but add GOOGLE_SERVICES_JSON secret for Firebase & Google Sign-In."
          fi

      - name: Prepare environment secrets
        env:
          MAP_TILES_API_KEY: ${{ secrets.MAP_TILES_API_KEY }}
        run: |
          if [ -n "$MAP_TILES_API_KEY" ]; then
            printf 'MAP_TILES_API_KEY=%s\n' "$MAP_TILES_API_KEY" > .env
            echo "Injected MAP_TILES_API_KEY into .env for build"
          fi

      - name: Run unit tests
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build APK
        id: build_apk
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            gradle :app:assembleRelease --no-daemon
            SRC_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            OUT_APK="kalye-${TAG}-release.apk"
          else
            gradle :app:assembleDebug --no-daemon
            SRC_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            OUT_APK="kalye-${TAG}.apk"
          fi
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
            echo "No APK artifact found!"
            exit 1
          fi
          cp "$SRC_APK" "$OUT_APK"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_apk.outputs.tag_name }}
          name: Kalye ${{ steps.build_apk.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ steps.build_apk.outputs.apk_path }}
